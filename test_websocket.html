<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test - MCP Sync Server</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .messages { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin: 10px 0; }
        .input { display: flex; gap: 10px; margin: 10px 0; }
        input { flex: 1; padding: 5px; }
        button { padding: 5px 15px; }
        .message { margin: 5px 0; padding: 5px; border-radius: 3px; }
        .sent { background: #e3f2fd; }
        .received { background: #f3e5f5; }
        .error { background: #ffebee; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background: #e8f5e8; }
        .disconnected { background: #ffebee; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔌 WebSocket Test - MCP Sync Server</h1>
        
        <div class="status" id="status">
            ⚡ Disconnected
        </div>
        
        <div class="input">
            <input type="text" id="messageInput" placeholder="Enter JSON message or use buttons below">
            <button onclick="sendMessage()">Send</button>
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
        </div>
        
        <div class="input">
            <button onclick="sendWhoami()">📋 Whoami</button>
            <button onclick="sendPing()">🏓 Ping</button>
            <button onclick="sendToolsList()">🔧 Tools List</button>
            <button onclick="sendDiagStatus()">📊 Diag Status</button>
        </div>
        
        <div class="messages" id="messages"></div>
    </div>

    <script>
        let ws = null;
        let clientId = null;
        
        function connect() {
            if (ws) {
                ws.close();
            }
            
            ws = new WebSocket('ws://127.0.0.1:3000/ws');
            
            ws.onopen = function() {
                updateStatus('🟢 Connected to WebSocket', 'connected');
                addMessage('Connected to ws://127.0.0.1:3000/ws', 'received');
            };
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.type === 'welcome') {
                    clientId = data.clientId;
                    addMessage(`Welcome! Client ID: ${clientId}`, 'received');
                } else {
                    addMessage(`Received: ${JSON.stringify(data, null, 2)}`, 'received');
                }
            };
            
            ws.onclose = function() {
                updateStatus('🔴 Disconnected', 'disconnected');
                addMessage('Disconnected from WebSocket', 'error');
            };
            
            ws.onerror = function(error) {
                updateStatus('❌ Connection Error', 'disconnected');
                addMessage(`WebSocket error: ${error}`, 'error');
            };
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !ws) return;
            
            try {
                const data = JSON.parse(message);
                ws.send(JSON.stringify(data));
                addMessage(`Sent: ${message}`, 'sent');
                input.value = '';
            } catch (e) {
                addMessage(`Invalid JSON: ${e.message}`, 'error');
            }
        }
        
        function sendWhoami() {
            sendJsonMessage({ type: 'whoami' });
        }
        
        function sendPing() {
            sendJsonMessage({ type: 'ping' });
        }
        
        function sendToolsList() {
            sendJsonMessage({
                type: 'mcp_call',
                requestId: Date.now(),
                method: 'tools/list'
            });
        }
        
        function sendDiagStatus() {
            sendJsonMessage({ type: 'diag_status' });
        }
        
        function sendJsonMessage(data) {
            if (!ws) {
                addMessage('Not connected to WebSocket', 'error');
                return;
            }
            
            ws.send(JSON.stringify(data));
            addMessage(`Sent: ${JSON.stringify(data, null, 2)}`, 'sent');
        }
        
        function updateStatus(text, className) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = `status ${className}`;
        }
        
        function addMessage(text, className) {
            const messages = document.getElementById('messages');
            const message = document.createElement('div');
            message.className = `message ${className}`;
            message.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong><br>${text}`;
            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;
        }
        
        // Auto-connect on load
        connect();
        
        // Handle Enter key
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
